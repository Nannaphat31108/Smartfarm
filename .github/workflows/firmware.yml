name: Compile firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "DHT sensor library" "Adafruit Unified Sensor" "BH1750" "ArduinoJson"
      - name: Compile main board (ESP32 DevKit)
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/smartfarm
      - name: Compile ESP32-CAM
        run: arduino-cli compile --fqbn esp32:esp32:esp32cam --build-property build.partitions=huge_app --build-property upload.maximum_size=3145728 firmware/esp32cam
