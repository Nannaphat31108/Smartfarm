name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app and Android project
        run: |
          npm run build
          npx cap add android
          scripts/prepare-android.sh "${{ github.run_number }}" "1.0.${{ github.run_number }}"
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SmartFarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartFarm-apk
          path: SmartFarm.apk

      - name: Publish to the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Smart Farm Android (ล่าสุด)
          body: |
            ดาวน์โหลด **SmartFarm.apk** แล้วเปิดในมือถือ Android เพื่อติดตั้ง
            (ต้องอนุญาต “ติดตั้งแอปจากแหล่งที่ไม่รู้จัก” สำหรับเบราว์เซอร์/ไฟล์ของคุณ)

            เวอร์ชัน 1.0.${{ github.run_number }} · commit ${{ github.sha }}
          files: SmartFarm.apk
          make_latest: true
